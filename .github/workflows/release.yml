name: Create Release

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: windows-latest
    env:
      CONFIGURATION: ${{ github.ref == 'refs/heads/staging' && '4. Oxide Staging' || '3. Oxide' }}
      DEPS_SCRIPT: ${{ github.ref == 'refs/heads/staging' && 'rust-staging+oxide+carbon' || 'rust+oxide+carbon' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v2

    - name: Download References
      shell: pwsh
      run: .\download-dependencies.ps1 -Script $env:DEPS_SCRIPT -ServerPlatform Windows -Publicize:$false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore and Build
      run: msbuild src/ConsoleExt/ConsoleExt.csproj -t:restore,Build -p:Configuration="${{ env.CONFIGURATION }}" -p:Platform=Windows -p:RustFramework=oxide+carbon

    - name: Create Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git fetch --tags --force
        $isStaging = $env:GITHUB_REF -eq 'refs/heads/staging'
        $tags = @(git tag -l)
        $pattern = if ($isStaging) { '^v(\d+)-staging$' } else { '^v(\d+)$' }
        $numbers = foreach ($tagName in $tags) {
          if ($tagName -match $pattern) { [int]$Matches[1] }
        }
        $max = ($numbers | Measure-Object -Maximum).Maximum
        $next = if ($null -eq $max) { 1 } else { $max + 1 }
        $tag = if ($isStaging) { "v$next-staging" } else { "v$next" }
        $dll = Join-Path $env:GITHUB_WORKSPACE "src\ConsoleExt\bin\Windows\$env:CONFIGURATION\net48\Oxide.Ext.ConsoleExt.dll"
        if (-not (Test-Path -LiteralPath $dll)) {
          throw "Built DLL not found at '$dll'."
        }

        if ($isStaging) {
          gh release create $tag $dll --prerelease --title $tag
          $viewExit = 0
          gh release view latest-staging 2>$null | Out-Null
          $viewExit = $LASTEXITCODE
          if ($viewExit -eq 0) {
            gh release delete latest-staging --cleanup-tag --yes
          }
          gh release create latest-staging $dll --prerelease --title "Staging (latest)" --notes "Currently $tag"
        } else {
          gh release create $tag $dll --latest --title $tag
        }

        Write-Host "Published $tag"
